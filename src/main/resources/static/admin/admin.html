<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель</title>
    <link rel="stylesheet" href="admin.css" />
</head>
<body>
    <div class="container">
        <h1>Админ-панель</h1>

        <!-- Кнопки переключения -->
        <div class="buttons">
            <button id="allUsersBtn" class="active">Все пользователи</button>
            <button id="guestsBtn">Согласные гости</button>
        </div>

        <!-- Таблица пользователей -->
        <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
            <thead>
                <tr style="background-color: #f4f4f4;">
                    <th style="text-align: left; padding: 10px; border-bottom: 2px solid #ddd;">Имя</th>
                    <th style="text-align: left; padding: 10px; border-bottom: 2px solid #ddd;">Ответы</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Данные будут подгружаться сюда -->
            </tbody>
        </table>

        <div id="pagination"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
